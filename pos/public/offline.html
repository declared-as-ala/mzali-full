<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Mzali POS — Hors ligne</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;color:#0f172a;font:16px/1.5 system-ui,sans-serif;padding:24px}.card{max-width:440px;border:1px solid #e2e8f0;border-radius:24px;background:white;padding:32px;text-align:center;box-shadow:0 18px 50px #0f172a14}.mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:#2563eb;color:white;font-size:30px;font-weight:900}h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#475569}button{min-height:48px;margin-top:24px;border:0;border-radius:14px;background:#2563eb;color:white;padding:0 22px;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">M</div>
      <h1>Connexion requise</h1>
      <p>La caisse protège les ventes et le stock. Reconnectez Internet, puis réessayez.</p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
