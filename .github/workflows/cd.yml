name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  publish-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3
      - name: Normalize GHCR owner
        shell: bash
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push storefront
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/mzali-storefront:${{ env.DEPLOY_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/mzali-storefront:latest

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/mzali-api:${{ env.DEPLOY_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/mzali-api:latest

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/mzali-worker:${{ env.DEPLOY_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/mzali-worker:latest

      - name: Deploy approved SHA to VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          envs: DEPLOY_SHA
          script_stop: true
          script: |
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            bash ./deploy/scripts/deploy.sh "$DEPLOY_SHA"
