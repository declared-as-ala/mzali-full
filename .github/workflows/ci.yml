name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit makes an unfinished CI run for the same branch obsolete.
# Production deployment has its own non-cancelling concurrency guard, so this
# only saves runner time and never interrupts a deployment in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx next lint
      - run: npx tsc --noEmit
      - run: npm run test:session
      - run: npm run build

  pos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:session
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r0
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: mzali-ci
          MINIO_ROOT_PASSWORD: mzali-ci-password
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 4000
      MONGODB_URI: mongodb://localhost:27017/mzali?directConnection=true
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: mzali-ci
      MINIO_SECRET_KEY: mzali-ci-password
      MINIO_PUBLIC_URL: http://localhost:9000
      JWT_ACCESS_SECRET: ci-jwt-secret-at-least-thirty-two-characters
      SERVICE_TOKEN: ci-service-token-at-least-thirty-two-chars
      SWAGGER_ENABLED: "false"
      STRICT_STOCK: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB replica-set service container
        run: |
          docker run -d --name mzali-ci-mongo -p 27017:27017 mongo:7 \
            mongod --replSet rs0 --bind_ip_all
          for _ in {1..30}; do
            docker exec mzali-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -q 1 && break
            sleep 2
          done
          docker exec mzali-ci-mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok"
          for _ in {1..30}; do
            docker exec mzali-ci-mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null | grep -q 1 && break
            sleep 2
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check:contracts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand

  # Builds and publishes the `mc` (MinIO Client) replacement image — see
  # deploy/Dockerfile.mc's doc comment for why this exists: quay.io/
  # minio/mc stopped resolving anonymously on 2026-09-25, so minio-init
  # (and backup-minio.sh / restore-minio.sh, which both run `mc` inside
  # that same service's image) now pull this instead. Fixed tag tied to
  # the mc release baked in, not to this app repo's own commit SHAs —
  # this image only needs rebuilding when deploy/Dockerfile.mc changes.
  mc-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize GHCR owner
        shell: bash
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build mc image
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile.mc
          push: false
          load: true
          tags: |
            mc:ci
            ghcr.io/${{ env.IMAGE_OWNER }}/mc:RELEASE.2025-08-13T08-35-41Z
            ghcr.io/${{ env.IMAGE_OWNER }}/mc:latest
          cache-from: type=gha,scope=mc-image
          cache-to: type=gha,mode=max,scope=mc-image
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish mc image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          docker push "ghcr.io/$IMAGE_OWNER/mc:RELEASE.2025-08-13T08-35-41Z"
          docker push "ghcr.io/$IMAGE_OWNER/mc:latest"

  compose-validate:
    needs: [mc-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose and MinIO image availability
        env:
          # Dummy values only — this step never starts anything. It validates
          # the merged config and checks MinIO manifests before deployment.
          GHCR_OWNER: ci
          IMAGE_TAG: ci
          STOREFRONT_DOMAIN: shop.example.com
          WWW_DOMAIN: www.example.com
          ADMIN_DOMAIN: admin.example.com
          POS_DOMAIN: pos.example.com
          API_DOMAIN: api.example.com
          MEDIA_DOMAIN: media.example.com
          MINIO_PUBLIC_URL: https://media.example.com
          CADDY_ACME_EMAIL: ops@example.com
          SERVICE_TOKEN: ci-placeholder-32-characters-long!!
          JWT_ACCESS_SECRET: ci-placeholder-32-characters-long!!
          SESSION_SECRET: ci-placeholder-32-characters-long!!
          NEXT_PUBLIC_SITE_URL: https://shop.example.com
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci-placeholder-password
          MONGO_REPLICA_KEY: ci-placeholder-key
          MONGODB_URI: mongodb://ci:ci-placeholder-password@mongo:27017/mzali?replicaSet=rs0&authSource=admin
          REDIS_PASSWORD: ci-placeholder-password
          REDIS_URL: redis://:ci-placeholder-password@redis:6379
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: ci-placeholder-password
        run: |
          COMPOSE="docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml"
          $COMPOSE config -q

          # `--images minio-init` also returns `minio`'s image (its
          # depends_on target) -- compose resolves the full dependency
          # chain for a named service, not just that service's own image.
          # Verified live locally; do not assume single-line output here.
          images=$($COMPOSE config --images minio-init)
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            if [[ "$image" == quay.io/minio/* ]]; then
              # minio (the object-storage SERVER) is still pinned to a
              # quay.io digest that stopped resolving anonymously on
              # 2026-09-25 -- confirmed live: MinIO restricted anonymous
              # pulls for their own images on BOTH quay.io and Docker Hub,
              # not a transient blip, and no GitHub-Releases binary or
              # working mirror exists for the server (unlike the `mc`
              # client, handled below). The already-running production
              # container has this exact digest cached locally and keeps
              # serving without a fresh pull (deploy.sh's `compose pull
              # --ignore-pull-failures` makes the same trade-off
              # deliberately), so this is a WARNING, not a hard failure,
              # until a real long-term fix (a self-hosted mirror in our
              # own GHCR, most likely) lands -- track that separately,
              # don't silently forget it.
              if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                echo "::warning::$image is not reachable upstream (MinIO restricted anonymous registry pulls). The running production container already has it cached and is unaffected, but a fresh VPS or an image prune would fail to pull it -- needs a real fix (self-hosted mirror)."
              fi
            else
              # minio-init's own image (alpine:3.20 + the `mc` binary
              # fetched from GitHub Releases at container start, see that
              # service's compose comment) -- expected to always resolve,
              # so this hard-fails the job.
              docker buildx imagetools inspect "$image" >/dev/null
            fi
          done <<< "$images"

  docker:
    needs: [frontend, pos, backend, compose-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: storefront
            context: .
            dockerfile: Dockerfile
            cache_scope: storefront
          - service: pos
            context: pos
            dockerfile: pos/Dockerfile
            cache_scope: pos
          - service: api
            context: backend
            dockerfile: backend/Dockerfile.api
            cache_scope: backend-api
          - service: worker
            context: backend
            dockerfile: backend/Dockerfile.worker
            cache_scope: backend-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize GHCR owner
        shell: bash
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            mzali-${{ matrix.service }}:ci
            ghcr.io/${{ env.IMAGE_OWNER }}/mzali-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/mzali-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Scan ${{ matrix.service }} image for known-critical CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mzali-${{ matrix.service }}:ci
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      # Only trusted master runs publish. Pull requests still build and scan
      # the exact same Dockerfiles, but never authenticate to the registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish approved ${{ matrix.service }} image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          # Retry registry upload failures (including GHCR "unknown blob")
          # using the same built image. Exhaustion still blocks deployment.
          push_with_retry() {
            local image="$1"
            local attempt
            for attempt in 1 2 3 4; do
              if docker push "$image"; then
                return 0
              fi
              if (( attempt == 4 )); then
                echo "::error::Failed to publish $image after $attempt attempts"
                return 1
              fi
              echo "::warning::Publish attempt $attempt failed for $image; retrying"
              sleep "$(( attempt * 10 ))"
            done
          }
          push_with_retry "ghcr.io/$IMAGE_OWNER/mzali-${{ matrix.service }}:${GITHUB_SHA}"
          push_with_retry "ghcr.io/$IMAGE_OWNER/mzali-${{ matrix.service }}:latest"
