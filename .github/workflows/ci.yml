name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx next lint
      - run: npx tsc --noEmit
      - run: npm run build

  pos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r0
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: mzali-ci
          MINIO_ROOT_PASSWORD: mzali-ci-password
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 4000
      MONGODB_URI: mongodb://localhost:27017/mzali?directConnection=true
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: mzali-ci
      MINIO_SECRET_KEY: mzali-ci-password
      MINIO_PUBLIC_URL: http://localhost:9000
      JWT_ACCESS_SECRET: ci-jwt-secret-at-least-thirty-two-characters
      SERVICE_TOKEN: ci-service-token-at-least-thirty-two-chars
      SWAGGER_ENABLED: "false"
      STRICT_STOCK: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB replica-set service container
        run: |
          docker run -d --name mzali-ci-mongo -p 27017:27017 mongo:7 \
            mongod --replSet rs0 --bind_ip_all
          for _ in {1..30}; do
            docker exec mzali-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -q 1 && break
            sleep 2
          done
          docker exec mzali-ci-mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok"
          for _ in {1..30}; do
            docker exec mzali-ci-mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null | grep -q 1 && break
            sleep 2
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check:contracts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run test:integration

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose (base + prod overlay)
        env:
          # Dummy values only — this step never starts anything, it just
          # confirms the merged compose file is well-formed and every
          # required variable resolves.
          GHCR_OWNER: ci
          IMAGE_TAG: ci
          STOREFRONT_DOMAIN: shop.example.com
          WWW_DOMAIN: www.example.com
          ADMIN_DOMAIN: admin.example.com
          POS_DOMAIN: pos.example.com
          API_DOMAIN: api.example.com
          MEDIA_DOMAIN: media.example.com
          MINIO_PUBLIC_URL: https://media.example.com
          CADDY_ACME_EMAIL: ops@example.com
          SERVICE_TOKEN: ci-placeholder-32-characters-long!!
          JWT_ACCESS_SECRET: ci-placeholder-32-characters-long!!
          SESSION_SECRET: ci-placeholder-32-characters-long!!
          NEXT_PUBLIC_SITE_URL: https://shop.example.com
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci-placeholder-password
          MONGO_REPLICA_KEY: ci-placeholder-key
          MONGODB_URI: mongodb://ci:ci-placeholder-password@mongo:27017/mzali?replicaSet=rs0&authSource=admin
          REDIS_PASSWORD: ci-placeholder-password
          REDIS_URL: redis://:ci-placeholder-password@redis:6379
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: ci-placeholder-password
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build storefront image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: mzali-storefront:ci
      - name: Build POS image
        uses: docker/build-push-action@v6
        with:
          context: pos
          file: pos/Dockerfile
          push: false
          load: true
          tags: mzali-pos:ci
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.api
          push: false
          load: true
          tags: mzali-api:ci
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.worker
          push: false
          load: true
          tags: mzali-worker:ci

      - name: Scan storefront image for known-critical CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: mzali-storefront:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan POS image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: mzali-pos:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: mzali-api:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan worker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: mzali-worker:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
