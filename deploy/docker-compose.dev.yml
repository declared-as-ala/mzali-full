services:
  mongo:
    ports:
      - "27017:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

# Docker Desktop does not forward published host ports from an internal-only
# network. The base remains isolated; local development explicitly opens it.
networks:
  mzali-internal:
    internal: false
