services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    networks: [mzali-internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mzali-internal]

  minio:
    # Use the official Quay image, pinned so deploys cannot silently upgrade storage.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mzali-internal]

  minio-init:
    # quay.io/minio/mc stopped resolving anonymously (401 Unauthorized, as
    # of 2026-09-25 — MinIO restricted anonymous pulls on both quay.io and
    # Docker Hub for their own images). `docker compose config -q` in CI
    # HEAD-checks every pinned digest, so a dead reference here fails the
    # whole pipeline before anything even runs. Fix: a plain, still-freely-
    # pullable alpine image that fetches the `mc` binary straight from
    # GitHub Releases (checksum-verified) at container start instead of
    # depending on MinIO's own registries at all.
    image: alpine:3.20
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        MC_VERSION="RELEASE.2025-08-13T08-35-41Z"
        wget -qO /usr/local/bin/mc "https://github.com/minio/mc/releases/download/$${MC_VERSION}/mc.linux-amd64.$${MC_VERSION}"
        echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  /usr/local/bin/mc" | sha256sum -c -
        chmod +x /usr/local/bin/mc
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        for bucket in catalog categories banners avatars documents exports temp; do
          mc mb --ignore-existing "local/$${bucket}"
        done
        mc ilm rule add --expire-days 7 local/temp || true
        mc anonymous set download local/catalog
        mc anonymous set download local/categories
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mzali-internal]

volumes:
  mongo-data:
  redis-data:
  minio-data:

networks:
  mzali-internal:
    internal: true
