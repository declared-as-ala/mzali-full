x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  storefront:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/mzali-storefront:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      COMMERCE_PROVIDER: ${COMMERCE_PROVIDER:-mzali-api}
      MZALI_API_URL: http://api:4000
      MZALI_SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      # Must match the api/worker value below — this is only the *cookie's*
      # maxAge hint to the browser; the backend's Session documents are the
      # actual source of truth for when a refresh token stops working.
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-90}
      AUTH_PROACTIVE_REFRESH_SECONDS: ${AUTH_PROACTIVE_REFRESH_SECONDS:-60}
      COOKIE_SECURE: "true"
      # Read by middleware.ts to decide when to rewrite requests to /admin/*.
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Boutique Ahmed Mzali}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_CURRENCY_CODE: ${NEXT_PUBLIC_CURRENCY_CODE:-TND}
      NEXT_PUBLIC_CURRENCY_SYMBOL: ${NEXT_PUBLIC_CURRENCY_SYMBOL:-DT}
    depends_on:
      api:
        condition: service_healthy
    networks: [mzali-internal]
    logging: *default-logging

  pos:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/mzali-pos:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MZALI_API_URL: http://api:4000
      MZALI_SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-90}
      AUTH_PROACTIVE_REFRESH_SECONDS: ${AUTH_PROACTIVE_REFRESH_SECONDS:-60}
      COOKIE_SECURE: "true"
    depends_on:
      api:
        condition: service_healthy
    networks: [mzali-internal]
    logging: *default-logging

  api:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/mzali-api:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment: &backend-environment
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?Set MINIO_PUBLIC_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-90}
      SESSION_ROLLING_ENABLED: ${SESSION_ROLLING_ENABLED:-true}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN}
      STRICT_STOCK: ${STRICT_STOCK:-false}
      SWAGGER_ENABLED: "false"
      # Off by default — no browser calls the API directly today (storefront
      # and POS both proxy through their own BFF over the internal network).
      # Only takes effect if you explicitly set it in deploy/.env.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      NAVEX_API_BASE: ${NAVEX_API_BASE:-https://app.navex.tn}
      NAVEX_TOKEN_ADD: ${NAVEX_TOKEN_ADD:-}
      NAVEX_TOKEN_GET: ${NAVEX_TOKEN_GET:-}
      NAVEX_TOKEN_DELETE: ${NAVEX_TOKEN_DELETE:-}
      NAVEX_AUTO_PUSH_LABEL: ${NAVEX_AUTO_PUSH_LABEL:-navex}
      FIRST_DELIVERY_API_BASE: ${FIRST_DELIVERY_API_BASE:-https://www.firstdeliverygroup.com/api/v2}
      FIRST_DELIVERY_TOKEN: ${FIRST_DELIVERY_TOKEN:-}
      FIRST_DELIVERY_AUTO_PUSH_LABEL: ${FIRST_DELIVERY_AUTO_PUSH_LABEL:-firstdelivery}
      AXESS_API_BASE: ${AXESS_API_BASE:-}
      AXESS_TOKEN: ${AXESS_TOKEN:-}
      AXESS_ENTREPOT_ID: ${AXESS_ENTREPOT_ID:-}
      AXESS_SOURCE_NOM: ${AXESS_SOURCE_NOM:-}
      AXESS_SOURCE_TEL: ${AXESS_SOURCE_TEL:-}
      AXESS_SOURCE_ADDRESS: ${AXESS_SOURCE_ADDRESS:-}
      AXESS_SOURCE_GOV: ${AXESS_SOURCE_GOV:-}
      AXESS_SOURCE_DELEGATION: ${AXESS_SOURCE_DELEGATION:-}
      AXESS_SOURCE_LOCALITE: ${AXESS_SOURCE_LOCALITE:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # mzali-internal has no route out (see the base compose file) — a
    # deliberate boundary so a compromised/tricked API container can't be
    # used to reach arbitrary external hosts (SSRF blast-radius limit).
    # egress is the one narrow, intentional exception: outbound calls this
    # container legitimately needs to make itself — Navex/First Delivery/
    # Axess carrier pushes today. Nothing else (mongo/redis/minio/
    # storefront/pos) is on it.
    networks: [mzali-internal, egress]
    logging: *default-logging

  worker:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/mzali-worker:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *backend-environment
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Same egress exception as api, and for the same reason this container
    # specifically needs it: the carrier-push queue processor (async/retry
    # Navex/First Delivery/Axess pushes) and the migrate:* CLI commands
    # (WooCommerce REST API) both make outbound calls from here too.
    networks: [mzali-internal, egress]
    logging: *default-logging

  mongo:
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        printf '%s' "$${MONGO_REPLICA_KEY}" > /tmp/mongo-keyfile
        chown mongodb:mongodb /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --auth --keyFile /tmp/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?Set MONGO_REPLICA_KEY}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [mzali-internal]
    logging: *default-logging

  redis:
    restart: unless-stopped
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mzali-internal]
    logging: *default-logging

  minio:
    restart: unless-stopped
    logging: *default-logging

  minio-init:
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        for bucket in catalog categories banners avatars documents exports temp; do
          mc mb --ignore-existing "local/$${bucket}"
        done
        mc ilm rule add --expire-days 7 local/temp || true
        mc anonymous set download local/catalog
        mc anonymous set download local/categories
        mc anonymous set download local/banners
    volumes:
      - ${BACKUP_TARGET:-/backups}:/backups
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN:?Set STOREFRONT_DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN:?Set WWW_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      POS_DOMAIN: ${POS_DOMAIN:?Set POS_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?Set MEDIA_DOMAIN}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?Set CADDY_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      storefront:
        condition: service_healthy
      pos:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [mzali-internal, caddy-edge]
    logging: *default-logging

volumes:
  caddy-data:
  caddy-config:

networks:
  caddy-edge:
    internal: false
  # Real egress, for api/worker only — see the comments on those services.
  # Nothing routes into this network from outside; it exists purely so
  # those two containers can reach external hosts (courier APIs today).
  egress:
    internal: false
